<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مركز إنماء برو | خدمات التنظيف في أم البواقي</title>
    <meta
      name="description"
      content="مركز إنماء برو للتدريب والتنظيف والإحصاء: تنظيف المنازل والمؤسسات والعمارات والتجمعات السكنية في أم البواقي، عند الطلب أو بعقد. ثقتكم ... أساس نجاحنا."
    />
    <meta name="theme-color" content="#fbfbf8" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="مركز إنماء برو — ثقتكم ... أساس نجاحنا" />
    <meta property="og:description" content="خدمات التنظيف في أم البواقي: المنازل، المؤسسات، العمارات والتجمعات السكنية. عند الطلب أو بعقد." />
    <meta property="og:locale" content="ar_DZ" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      // Set the language and direction before the first paint, so a French or English visit never flashes right to left.
      (function () {
        var lang = new URLSearchParams(location.search).get("lang");
        if (["ar", "fr", "en"].indexOf(lang) < 0) {
          try {
            lang = localStorage.getItem("inmaa-pro-lang");
          } catch (e) {}
        }
        if (lang === "fr" || lang === "en") {
          document.documentElement.lang = lang;
          document.documentElement.dir = "ltr";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
